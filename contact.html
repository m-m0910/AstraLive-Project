<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>entry page</title>
    <link rel="icon" href="favicon.ico" />

    <meta property="og:image" content="画像のURL" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&family=Kaisei+Decol&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="entry-page">
    <div class="phrase">
      <h1>
        Vtuberオーディション <br />
        応募フォーム
      </h1>
      <p class="desc">
        夢への第一歩を、ここから。<br />
        あなたの声と想いを、私たちは待っています。
      </p>
    </div>
    <div class="main-form">
      <div class="steps">
        <div class="step">
          <div class="circle">1</div>
          入力
        </div>
        <div class="step">
          <div class="circle">2</div>
          確認
        </div>
        <div class="step">
          <div class="circle">3</div>
          完了
        </div>
      </div>
      <form>
        <section id="name">
          <h2 class="section-title">
            SECTION 01 基本情報
            <span class="required">必須</span>
          </h2>
          <div class="form-group">
            <label>名前（本名）</label>
            <input type="text" />
          </div>
          <div class="form-group">
            <label>名前（フリガナ）</label>

            <input type="text" />
          </div>
          <div class="form-group">
            <label>年齢</label>
            <input type="number" />
          </div>
          <div class="form-group">
            <label>性別</label>

            <div class="gender">
              <label><input type="radio" name="gender" /> 男性</label>
              <label><input type="radio" name="gender" /> 女性</label>
              <label><input type="radio" name="gender" /> その他</label>
            </div>
          </div>
        </section>

        <section id="adress">
          <h2 class="section-title">
            SECTION 02 連絡先
            <span class="required">必須</span>
          </h2>
          <div class="for-mgroup">
            <label>メールアドレス</label>
            <input type="email" />
          </div>
          <div class="form-group">
            <label>電話番号</label>
            <input type="tel" />
          </div>
        </section>

        <section id="date">
          <h2 class="section-title">SECTION 03 ボイスデータ</h2>
          <div class="upload-date">
            <p>ここにファイルをドラッグ＆ドロップ</p>
            <a href="#" class="upload-btn"> ファイルを選択 </a>
            <p style="margin-top: 15px">mp3 / wav 推奨</p>
          </div>
        </section>

        <section id="aspiration">
          <h2 class="section-title">
            SECTION 04 志望動機
            <span class="required">必須</span>
          </h2>

          <div class="form-group">
            <textarea
              placeholder="Vtuberになりたい理由、どんな活動がしたいか自由にお書きください"
            ></textarea>
          </div>
        </section>

        <section id="good">
          <h2 class="section-title">
            SECTION 05 あなたの得意を教えてください
            <span class="any">任意</span>
          </h2>

          <div class="form-group">
            <label>あなたが今までにやりこんだゲームを教えてください</label>
            <input type="text" />
          </div>
          <div class="form-group">
            <label>あなたが今までに企画した内容を教えてください</label>
            <input type="text" />
          </div>
          <div class="form-group">
            <label>その他アピールしたいことがあればお書きください</label>
            <input type="text" />
          </div>
        </section>
      </form>
    </div>
  </body>
</html>
